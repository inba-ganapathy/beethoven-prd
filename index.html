<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Beethoven GenUI — Strategic Evolution</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    /* =========================================================
       CSS CUSTOM PROPERTIES
    ========================================================= */
    :root {
      --bg:          #0a0c14;
      --surface:     #12151f;
      --surface2:    #1a1e2e;
      --surface3:    #21263a;
      --border:      #2a2f4a;
      --primary:     #6366f1;
      --primary-dim: #3730a3;
      --accent:      #10b981;
      --warn:        #f59e0b;
      --danger:      #ef4444;
      --text:        #e2e8f0;
      --muted:       #64748b;
      --code-bg:     #0d1117;
    }

    /* =========================================================
       RESET & BASE
    ========================================================= */
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      font-size: 15px;
      line-height: 1.6;
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      padding-bottom: 48px; /* room for fixed footer */
    }

    a {
      color: var(--primary);
      text-decoration: none;
    }
    a:hover {
      text-decoration: underline;
    }

    /* =========================================================
       HERO HEADER
    ========================================================= */
    .hero {
      position: relative;
      width: 100%;
      min-height: 220px;
      display: flex;
      align-items: center;
      background: linear-gradient(135deg, #0f0f2e 0%, #1a1040 50%, #0f1117 100%);
      overflow: hidden;
    }

    /* Subtle grid pattern overlay */
    .hero::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image:
        repeating-linear-gradient(
          0deg,
          rgba(99, 102, 241, 0.04) 0px,
          rgba(99, 102, 241, 0.04) 1px,
          transparent 1px,
          transparent 40px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(99, 102, 241, 0.04) 0px,
          rgba(99, 102, 241, 0.04) 1px,
          transparent 1px,
          transparent 40px
        );
      pointer-events: none;
    }

    .hero-inner {
      position: relative;
      z-index: 1;
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 28px;
      width: 100%;
    }

    .hero-glyph {
      font-size: 3.5rem;
      color: rgba(99, 102, 241, 0.18);
      font-family: serif;
      line-height: 1;
      margin-bottom: 6px;
      user-select: none;
    }

    .hero-title {
      font-size: 2.8rem;
      font-weight: 800;
      color: #ffffff;
      letter-spacing: -0.5px;
      line-height: 1.15;
      margin-bottom: 6px;
    }

    .hero-subtitle {
      font-size: 1rem;
      color: rgba(226, 232, 240, 0.65);
      font-weight: 400;
      margin-bottom: 14px;
      letter-spacing: 0.01em;
    }

    .hero-badges {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
    }
    .hero-badge.indigo {
      background: rgba(99, 102, 241, 0.2);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.35);
    }
    .hero-badge.amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }

    /* =========================================================
       STICKY NAVIGATION BAR
    ========================================================= */
    .nav-bar {
      position: sticky;
      top: 0;
      z-index: 100;
      width: 100%;
      background: rgba(10, 12, 20, 0.92);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border);
    }

    .nav-inner {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 28px;
      display: flex;
      align-items: stretch;
      gap: 0;
      overflow-x: auto;
      scrollbar-width: none;
    }
    .nav-inner::-webkit-scrollbar {
      display: none;
    }

    .tab-btn {
      display: inline-flex;
      align-items: center;
      padding: 0 18px;
      height: 48px;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: none;
      border-bottom: 3px solid transparent;
      cursor: pointer;
      white-space: nowrap;
      transition: color 0.18s, border-color 0.18s;
      font-family: inherit;
      letter-spacing: 0.01em;
    }
    .tab-btn:hover {
      color: var(--text);
    }
    .tab-btn.active {
      color: #ffffff;
      border-bottom-color: var(--primary);
    }

    /* =========================================================
       MAIN CONTENT WRAPPER
    ========================================================= */
    main#main-content {
      max-width: 1120px;
      margin: 0 auto;
      padding: 0 28px 80px;
    }

    /* =========================================================
       TAB SECTIONS
    ========================================================= */
    .tab-section {
      padding-top: 36px;
    }

    /* =========================================================
       STICKY FOOTER
    ========================================================= */
    .site-footer {
      position: fixed;
      bottom: 0;
      left: 0;
      width: 100%;
      height: 48px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 24px;
      z-index: 200;
    }

    .footer-brand {
      font-size: 12px;
      color: var(--muted);
      font-weight: 400;
      letter-spacing: 0.02em;
    }

    .footer-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 5px 12px;
      background: var(--surface2);
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 12px;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-weight: 500;
      transition: background 0.15s, border-color 0.15s;
    }
    .footer-btn:hover {
      background: var(--surface3);
      border-color: var(--primary);
    }

    /* =========================================================
       GLOBAL UTILITY CLASSES — used by child fragments
    ========================================================= */

    /* --- Section headings --- */
    .section-heading {
      font-size: 1.6rem;
      font-weight: 700;
      color: var(--text);
      border-left: 5px solid var(--primary);
      padding-left: 16px;
      margin-bottom: 24px;
      margin-top: 0;
      line-height: 1.3;
    }

    .subsection-heading {
      font-size: 1.1rem;
      font-weight: 600;
      color: var(--text);
      border-left: 3px solid var(--primary);
      padding-left: 12px;
      margin-bottom: 16px;
      margin-top: 28px;
      line-height: 1.4;
    }

    /* --- Callout cards --- */
    .callout {
      --callout-color: var(--primary);
      background: var(--surface2);
      border-left: 4px solid var(--callout-color);
      border-radius: 0 8px 8px 0;
      padding: 16px 20px;
      margin-bottom: 18px;
    }
    .callout p:last-child {
      margin-bottom: 0;
    }
    .callout.indigo {
      --callout-color: var(--primary);
    }
    .callout.amber {
      --callout-color: var(--warn);
    }
    .callout.red {
      --callout-color: var(--danger);
    }
    .callout.green {
      --callout-color: var(--accent);
    }

    /* --- Cards --- */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 20px;
      margin-bottom: 16px;
    }

    .card-grid-2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    .card-grid-3 {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 16px;
      margin-bottom: 16px;
    }

    @media (max-width: 768px) {
      .card-grid-2,
      .card-grid-3 {
        grid-template-columns: 1fr;
      }
    }

    /* --- Badges --- */
    .badge {
      display: inline-flex;
      align-items: center;
      padding: 2px 8px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      vertical-align: middle;
    }
    .badge.red {
      background: rgba(239, 68, 68, 0.15);
      color: #fca5a5;
      border: 1px solid rgba(239, 68, 68, 0.3);
    }
    .badge.amber {
      background: rgba(245, 158, 11, 0.15);
      color: #fcd34d;
      border: 1px solid rgba(245, 158, 11, 0.3);
    }
    .badge.green {
      background: rgba(16, 185, 129, 0.15);
      color: #6ee7b7;
      border: 1px solid rgba(16, 185, 129, 0.3);
    }
    .badge.indigo {
      background: rgba(99, 102, 241, 0.15);
      color: #a5b4fc;
      border: 1px solid rgba(99, 102, 241, 0.3);
    }
    .badge.purple {
      background: rgba(168, 85, 247, 0.15);
      color: #d8b4fe;
      border: 1px solid rgba(168, 85, 247, 0.3);
    }

    /* --- Data table --- */
    .data-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 20px;
      font-size: 14px;
    }
    .data-table thead tr {
      background: var(--surface3);
    }
    .data-table th {
      padding: 10px 14px;
      text-align: left;
      font-weight: 600;
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: var(--muted);
      border-bottom: 1px solid var(--border);
    }
    .data-table td {
      padding: 10px 14px;
      border-bottom: 1px solid var(--border);
      color: var(--text);
      vertical-align: top;
    }
    .data-table tbody tr:nth-child(even) {
      background: var(--surface2);
    }
    .data-table tbody tr:nth-child(odd) {
      background: var(--surface);
    }
    .data-table tbody tr:hover {
      background: var(--surface3);
    }

    /* --- Code block --- */
    .code-block {
      background: var(--code-bg);
      border: 1px solid var(--border);
      border-radius: 8px;
      overflow-x: auto;
      padding: 16px;
      font-family: 'SFMono-Regular', 'Cascadia Code', 'Fira Code', Consolas, 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.6;
      color: #c9d1d9;
      margin-bottom: 16px;
      white-space: pre;
    }

    /* --- Tag / pill --- */
    .tag {
      display: inline-flex;
      align-items: center;
      padding: 2px 9px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 500;
      border: 1px solid var(--border);
      color: var(--muted);
      background: var(--surface2);
      vertical-align: middle;
      margin: 2px 2px;
    }

    /* --- Highlight number (large stat) --- */
    .highlight-number {
      display: inline-block;
      font-size: 3rem;
      font-weight: 800;
      color: var(--primary);
      line-height: 1.1;
      letter-spacing: -1px;
    }

    /* --- Problem card --- */
    .problem-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--danger);
      border-radius: 0 10px 10px 0;
      padding: 20px;
      margin-bottom: 16px;
    }

    /* --- Fix card --- */
    .fix-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-left: 4px solid var(--accent);
      border-radius: 0 10px 10px 0;
      padding: 20px;
      margin-bottom: 16px;
    }

    /* --- Metric row --- */
    .metric-row {
      display: flex;
      align-items: center;
      gap: 16px;
      padding: 10px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .metric-row:last-child {
      border-bottom: none;
    }
    .metric-row .metric-label {
      flex: 1;
      font-weight: 500;
      color: var(--text);
    }
    .metric-row .metric-baseline {
      min-width: 100px;
      text-align: right;
      color: var(--danger);
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 13px;
    }
    .metric-row .metric-target {
      min-width: 100px;
      text-align: right;
      color: var(--accent);
      font-family: 'SFMono-Regular', Consolas, monospace;
      font-size: 13px;
    }

    /* =========================================================
       MISC HELPERS
    ========================================================= */
    p {
      margin-bottom: 14px;
      color: var(--text);
    }
    ul, ol {
      padding-left: 22px;
      margin-bottom: 14px;
    }
    li {
      margin-bottom: 5px;
      color: var(--text);
    }
    strong {
      font-weight: 600;
      color: #f1f5f9;
    }
    hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 28px 0;
    }

    /* =========================================================
       PRINT STYLES
    ========================================================= */
    @media print {
      :root {
        --bg:       #ffffff;
        --surface:  #f8f9fa;
        --surface2: #f1f3f5;
        --surface3: #e9ecef;
        --border:   #dee2e6;
        --primary:  #4f46e5;
        --text:     #1a1a2e;
        --muted:    #6c757d;
        --code-bg:  #f6f8fa;
      }

      body {
        background: #ffffff;
        color: #1a1a2e;
        font-size: 13px;
        padding-bottom: 0;
      }

      .nav-bar,
      .site-footer {
        display: none !important;
      }

      .hero {
        background: #1a1040 !important;
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .tab-section {
        display: block !important;
        page-break-inside: avoid;
      }

      .card,
      .callout,
      .problem-card,
      .fix-card {
        break-inside: avoid;
      }

      main#main-content {
        max-width: 100%;
        padding: 0 12px 24px;
      }

      .data-table thead tr {
        -webkit-print-color-adjust: exact;
        print-color-adjust: exact;
      }

      .code-block {
        border: 1px solid #dee2e6;
        background: #f6f8fa;
        color: #24292e;
      }

      a {
        color: #4f46e5;
      }

      h1, h2, h3 {
        page-break-after: avoid;
      }
    }
  </style>
</head>
<body>

  <!-- =========================================================
       HERO HEADER
  ========================================================= -->
  <header class="hero">
    <div class="hero-inner">
      <div class="hero-glyph">♬</div>
      <h1 class="hero-title">Beethoven GenUI</h1>
      <p class="hero-subtitle">Strategic Evolution &middot; Enterprise Dynamic UI Platform</p>
      <div class="hero-badges">
        <span class="hero-badge indigo">May 2026</span>
        <span class="hero-badge amber">Confidential &middot; Internal</span>
      </div>
    </div>
  </header>

  <!-- =========================================================
       STICKY NAVIGATION BAR
  ========================================================= -->
  <nav class="nav-bar" role="navigation" aria-label="Document sections">
    <div class="nav-inner">
      <button
        class="tab-btn active"
        id="btn-tab-broken"
        onclick="showTab('tab-broken')"
        aria-selected="true"
        role="tab"
      >What's Broken</button>
      <button
        class="tab-btn"
        id="btn-tab-fix"
        onclick="showTab('tab-fix')"
        aria-selected="false"
        role="tab"
      >How We Fix It</button>
      <button
        class="tab-btn"
        id="btn-tab-tech"
        onclick="showTab('tab-tech')"
        aria-selected="false"
        role="tab"
      >Technical Deep Dive</button>
      <button
        class="tab-btn"
        id="btn-tab-market"
        onclick="showTab('tab-market')"
        aria-selected="false"
        role="tab"
      >Market &amp; Competition</button>
      <button
        class="tab-btn"
        id="btn-tab-research"
        onclick="showTab('tab-research')"
        aria-selected="false"
        role="tab"
      >Research Prompt</button>
    </div>
  </nav>

  <!-- =========================================================
       MAIN CONTENT
  ========================================================= -->
  <main id="main-content" role="main">

    <!-- Tab: What's Broken -->
    <section id="tab-broken" class="tab-section" role="tabpanel" aria-labelledby="btn-tab-broken">
      <div class="tab-loading" id="loading-tab-broken">Loading...</div>
    </section>

    <!-- Tab: How We Fix It -->
    <section id="tab-fix" class="tab-section" role="tabpanel" aria-labelledby="btn-tab-fix" style="display:none">
      <div class="tab-loading" id="loading-tab-fix">Loading...</div>
    </section>

    <!-- Tab: Technical Deep Dive -->
    <section id="tab-tech" class="tab-section" role="tabpanel" aria-labelledby="btn-tab-tech" style="display:none">
      <div class="tab-loading" id="loading-tab-tech">Loading...</div>
    </section>

    <!-- Tab: Market & Competition -->
    <section id="tab-market" class="tab-section" role="tabpanel" aria-labelledby="btn-tab-market" style="display:none">
      <div class="tab-loading" id="loading-tab-market">Loading...</div>
    </section>

    <!-- Tab: Research Prompt -->
    <section id="tab-research" class="tab-section" role="tabpanel" aria-labelledby="btn-tab-research" style="display:none">
      <div class="tab-loading" id="loading-tab-research">Loading...</div>
    </section>

  </main>

  <!-- STICKY FOOTER -->
  <footer class="site-footer" role="contentinfo">
    <span class="footer-brand">Beethoven GenUI &middot; Internal Strategy</span>
    <div class="footer-actions">
      <button class="footer-btn" id="copy-btn" onclick="copyAsMarkdown()" title="Copy all visible content as plain text">
        &#128203; Copy as Markdown
      </button>
      <button class="footer-btn" onclick="window.print()" title="Print this document">
        &#128424; Print
      </button>
    </div>
  </footer>

  <style>
    .tab-loading {
      padding: 60px 0;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      opacity: 0.6;
    }
    .tab-loading::before {
      content: '';
      display: inline-block;
      width: 20px;
      height: 20px;
      border: 2px solid var(--border);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin-right: 10px;
      vertical-align: middle;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>

  <script>
    // Tab files map
    var TAB_FILES = {
      'tab-broken':   'tab-broken.html',
      'tab-fix':      'tab-fix.html',
      'tab-tech':     'tab-tech.html',
      'tab-market':   'tab-market.html',
      'tab-research': 'tab-research.html'
    };
    var loadedTabs = {};

    function loadTab(id) {
      if (loadedTabs[id]) return Promise.resolve();
      var section = document.getElementById(id);
      if (!section) return Promise.resolve();
      return fetch(TAB_FILES[id])
        .then(function(r) { return r.text(); })
        .then(function(html) {
          section.innerHTML = html;
          loadedTabs[id] = true;
          // Re-run any inline scripts in the loaded fragment
          section.querySelectorAll('script').forEach(function(old) {
            var s = document.createElement('script');
            if (old.src) { s.src = old.src; } else { s.textContent = old.textContent; }
            old.parentNode.replaceChild(s, old);
          });
        })
        .catch(function(e) {
          section.innerHTML = '<p style="color:var(--danger);padding:40px 0;">Failed to load tab content. Open via a local server (e.g. <code>python3 -m http.server</code>).</p>';
        });
    }

    function showTab(id) {
      loadTab(id).then(function() {
        var sections = document.querySelectorAll('.tab-section');
        for (var i = 0; i < sections.length; i++) {
          sections[i].style.display = sections[i].id === id ? 'block' : 'none';
        }
        var buttons = document.querySelectorAll('.tab-btn');
        for (var j = 0; j < buttons.length; j++) {
          var btn = buttons[j];
          var btnTargetId = btn.id.replace('btn-', '');
          btn.classList.toggle('active', btnTargetId === id);
          btn.setAttribute('aria-selected', btnTargetId === id ? 'true' : 'false');
        }
      });
    }

    function copyAsMarkdown() {
      var content = document.getElementById('main-content');
      var text = content ? content.innerText : '';
      if (!navigator.clipboard) {
        var ta = document.createElement('textarea');
        ta.value = text; ta.style.position = 'fixed'; ta.style.opacity = '0';
        document.body.appendChild(ta); ta.select();
        try { document.execCommand('copy'); } catch(e) {}
        document.body.removeChild(ta); showCopyConfirm(); return;
      }
      navigator.clipboard.writeText(text).then(showCopyConfirm).catch(function(){});
    }

    function showCopyConfirm() {
      var btn = document.getElementById('copy-btn');
      if (!btn) return;
      var orig = btn.innerHTML;
      btn.innerHTML = '&#10003; Copied'; btn.style.color = '#6ee7b7'; btn.style.borderColor = '#10b981';
      setTimeout(function(){ btn.innerHTML = orig; btn.style.color = ''; btn.style.borderColor = ''; }, 2000);
    }

    // Preload first tab immediately, lazy-load others on first click
    showTab('tab-broken');
  </script>

</body>
</html>
